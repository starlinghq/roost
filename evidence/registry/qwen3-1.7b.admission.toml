  "sizes of all 12 files: Hub tree API at the revision",
  "SHA-256 of the 10 non-weight files: computed from downloads at the revision",
  "SHA-256 of tokenizer.json: computed, equal to the Hub LFS digest",
  "tokenizer and template digests equal to Starlings.Models.QwenChat 0.3.0 QwenChatProfile.Qwen3 (reflection)",
]
