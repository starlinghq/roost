# PROPOSED reference fixtures for Qwen3-1.7B (R-015, stream B3). NOT BINDING. The maintainer copies what they accept into
# evidence/protected/ and sets the binding tolerances and the near-tie bound per profile (decision 8); nothing here is read by any
# gate, and this file sets no tolerance. Rationale and open questions: evidence/proposals/r015-fixtures.md.
#
# The fixture data (greedy outputs, step-0 log-probabilities, per-layer hidden states) is 106 MB and never enters Git. This file
# pins it by SHA-256; the bytes sit in run artifacts on the development host (/home/mark/Projects/roost-evidence/R-015/ref) until
# the maintainer chooses where protected fixture data is published.
proposal_version = 1
status = "proposed"
item = "R-015"

[reference]
runner = "roost-evidence reference-run --capture-layers --state-forwards 0 (evidence/pipeline, R-010/R-011)"
numerics = "transformers 5.20.1, torch 2.9.1+cpu, safetensors 0.8.0, float32, CPU, OMP_NUM_THREADS=4 and MKL_NUM_THREADS=4"
reproducibility = "byte-identical across two runs at 4 threads on one host; at 2 threads the data files differ (greedy ids equal, step-0 max abs 4.2e-05, hidden rel L2 2.2e-06), so a digest identifies these bytes, and a rerun at another thread count may not hash the same (only 2 and 4 were tried)"
checkpoint = "Qwen/Qwen3-1.7B at 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e"
checkpoint_lock = "evidence/registry/qwen3-1.7b.lock.toml"
checkpoint_check = "all 12 locked files present, none extra, each equal to the lock by size and computed SHA-256 before use, including both safetensors shards"
prompt_set = "the five R022PromptSet conversations through Starling's Qwen3 template (Qwen3RoostChatTemplate over QwenChatCheckpoint.Qwen3, Starlings.Models.QwenChat 0.5.0, enable_thinking=false), tokenised by Starlings.Tokenizers 0.3.4, 25 to 133 prompt tokens"
template_check = "text and ids equal the checkpoint's own Jinja template and the transformers tokenizer for all five cases"
generation = "greedy, 24 new tokens per case, stop ids [151643, 151645] (none reached; finish_reason length)"
layers = "28 decoder layers, all full_attention; 30 stages per forward (embeddings, 28 layers, final norm)"
recurrent_state = "none: Qwen3-1.7B has no linear_attention layers, so the captures hold no recurrent or convolution state and state_forwards is 0"
produced_by = "the commands in evidence/proposals/r015-fixtures.md; the reference is independent of Roost's model code (no Qwen3-1.7B definition exists)"

