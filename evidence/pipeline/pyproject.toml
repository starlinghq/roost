# Roost's evidence pipeline (build plan section 3; streams B2 and B3). Test- and tool-time Python only: nothing here
# ships in the runtime or the image, and nothing under src/ may import it. Lint and format settings come from the
# repository's root ruff.toml, so this file deliberately has no [tool.ruff] table.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roost-evidence"
version = "0.1.0"
description = "Roost evidence pipeline: manifest validation (R-012), the generation evaluator (R-010), per-layer capture (R-011)."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "jsonschema==4.25.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Tool-time only: the transformers fp32 CPU reference runner (R-010) and its per-layer hook capture (R-011). Not installed
# by the default gate. transformers 5.20.1 is the pin whose Qwen3.5 implementation (Gated DeltaNet layers, cache-held
# recurrent state) runs on the CPU in float32 with its PyTorch fallbacks; 4.57.3 has no qwen3_5 model.
reference = [
    "torch==2.9.1",
    "transformers==5.20.1",
    "safetensors==0.8.0",
]

[project.scripts]
roost-evidence = "roost_evidence.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

# CPU wheels only: the default PyPI wheel on Linux pulls the CUDA runtime, which a CPU reference does not need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roost_evidence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
