# Roost's evidence pipeline (build plan section 3; streams B2 and B3). Test- and tool-time Python only: nothing here
# ships in the runtime or the image, and nothing under src/ may import it. Lint and format settings come from the
# repository's root ruff.toml, so this file deliberately has no [tool.ruff] table.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roost-evidence"
version = "0.1.0"
description = "Roost evidence pipeline: profile manifest validation today, the evaluator (R-010) next."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "jsonschema==4.25.1",
    "pyyaml==6.0.3",
]

[project.scripts]
roost-evidence = "roost_evidence.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roost_evidence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
