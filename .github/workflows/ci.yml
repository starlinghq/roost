name: ci

# Every pull request and every push. Hosted runners, CPU only, no secrets; read-only token. GPU work is local and
# leased through tools/gpu-lease (build plan section 8).
on:
  pull_request:
  push:
    branches: [main, "plan/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  # Names of an unrelated older project must never enter this repository (tools/check-boundary.py, shared with
  # starlinghq/starling): files, file names, embedded base64/hex data, commit authors and messages.
  boundary:
    name: boundary
    runs-on: [self-hosted, omarchy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: python3 -I tools/check-boundary.py

  # Roost.slnx in locked mode, then the Roost boundaries on the restored closure: no Python or libtorch under src/,
  # no Microsoft.ML.OnnxRuntime* in an engine package's closure, no kernel binaries in Git, no CUDA projects in the
  # solution. Windows builds too, so nothing closes the Windows path (build plan section 3).
  dotnet:
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted", "omarchy"]') || matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test (locked restore)
        run: dotnet test --solution Roost.slnx --configuration Release
      - name: Roost boundaries
        if: runner.os == 'Linux'
        run: python3 -I tools/check-roost-boundaries.py

  tools:
    name: tools (pytest, ruff)
    runs-on: [self-hosted, omarchy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: pipx run ruff==0.16.9 check .
      - run: pipx run ruff==0.16.9 format --check .
      - run: pipx run --spec pytest==8.4.2 pytest -q tests/tools
      - name: Backlog parses (dry run)
        run: python3 -I tools/create_backlog_issues.py > /dev/null

  # Contract layout (R-004): regenerate the golden layout of the C1, C2 and C8 structs with gcc and fail if it differs
  # from the committed file that the C# layout test reads on every OS; compile the headers as C11 and C++17; check the
  # golden layout under clang's MSVC target (clang in MSVC mode, not MSVC itself).
  abi:
    name: abi (C headers, golden layout)
    runs-on: [self-hosted, omarchy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Golden layout matches gcc
        run: python3 -I tools/abi-layout.py check
      - name: Headers compile (gcc -std=c11 -pedantic, g++ -std=c++17)
        run: python3 -I tools/abi-layout.py headers
      - name: Golden layout holds under clang --target=x86_64-pc-windows-msvc
        run: python3 -I tools/abi-layout.py msvc-asserts

  # MSVC itself (R-004; C1 says the headers compile under MSVC): cl.exe from the runner's Visual Studio, found with
  # vswhere, compiles both headers as C11 and C++17 with /W4 /WX and the golden layout as static asserts.
  abi-msvc:
    name: abi (MSVC cl.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Headers compile and golden layout holds under cl.exe
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the x64 C++ tools on this runner' }
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && python -I tools/abi-layout.py msvc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Kernel library (R-016): the manifest validates, a pin change carries its provenance files, and the library compiles
  # for every SM in kernels/manifest.toml (80, 86, 89, 90, 100, 120) inside a CUDA container pinned by digest. Build
  # only: the runners have no GPU, so every SM but the one that ran locally stays untested. The container is CUDA
  # 13.3.0 on Ubuntu 24.04; its digest is the multi-architecture index digest. MSVC: GitHub-hosted Windows runners
  # ship no CUDA toolkit, so the MSVC kernel build is not done (kernels/README.md).
  kernels:
    name: kernels (build every SM, provenance)
    runs-on: [self-hosted, omarchy]
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04@sha256:ef2203909e80b8b976cfc672f7e2ae2b00bc0e25c404ee86d89e10a3802f1c52
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake git ninja-build python3 python3-pytest
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Manifest validates (C5)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -I tools/validate-kernel-manifest.py
      - name: Provenance (a SHA bump needs PROVENANCE.md and THIRD-PARTY-NOTICES.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}"; then
            python3 -I kernels/tools/check_provenance.py --base "$BASE"
          else
            python3 -I kernels/tools/check_provenance.py
          fi
      - name: Kernel tool tests
        run: python3 -I -m pytest -q kernels/tests
      - name: Build every SM twice, compare, check the registration tables
        env:
          ROOST_DIGESTS_OUT: ${{ runner.temp }}/kernel-digests.json
        run: kernels/ci/build-all-sm.sh "$RUNNER_TEMP/kernels"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kernel-digests
          path: ${{ runner.temp }}/kernel-digests.json
      # The container runs as root on a self-hosted runner, so hand the workspace and temp tree back to the runner's
      # user or the next job's checkout cannot clean them.
      - name: Return workspace ownership to the runner user
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
