# Build-time Python closure for the Triton AOT kernels of the hybrid ops (decision 23, S3). Python is never a runtime
# dependency. The AOT build is kernels/aot/build_gdn.py (R-034), run by CMake with -DROOST_TRITON_PYTHON. The pins below are
# S3's measured configs (kernels/aot/pins.json is S3's pins.json; the fused recurrent kernel's config is fixed in FLA's
# wrapper), frozen because autotune winners are not reproducible. `specializations` counts what R-034 builds: only the
# varlen set (the engine packs sequences), and not l2norm_fwd_kernel, because the library normalises the strided q and k
# views in its own kernel. kernels/aot/gdn_specs.json holds the captured signatures, written by kernels/aot/capture_specs.py.
[triton_aot]
python = "3.12.14"
requires_gpu_build_host = true

[triton_aot.packages]
triton = "3.8.0"
torch = "2.14.1+cu130"
transformers = "5.20.1"
einops = "0.8.2"
numpy = "2.5.4"
fla = "0.6.0"

[[triton_aot.kernels]]
name = "chunk_local_cumsum_scalar_kernel"
upstream = "flash-linear-attention"
specializations = 1
config = { num_warps = 1, num_stages = 3 }

[[triton_aot.kernels]]
name = "chunk_gated_delta_rule_fwd_kkt_solve_kernel"
upstream = "flash-linear-attention"
specializations = 1
config = { num_warps = 1, num_stages = 3, constexprs = { BK = 64 } }

[[triton_aot.kernels]]
name = "recompute_w_u_fwd_kernel"
upstream = "flash-linear-attention"
specializations = 1
config = { num_warps = 2, num_stages = 2 }

[[triton_aot.kernels]]
name = "chunk_gated_delta_rule_fwd_kernel_h_blockdim64"
upstream = "flash-linear-attention"
specializations = 2
config = { num_warps = 2, num_stages = 2, constexprs = { BV = 32 } }

[[triton_aot.kernels]]
name = "chunk_fwd_kernel_o"
upstream = "flash-linear-attention"
specializations = 1
config = { num_warps = 2, num_stages = 3, constexprs = { BK = 32, BV = 32 } }

[[triton_aot.kernels]]
name = "fused_recurrent_gated_delta_rule_fwd_kernel"
upstream = "flash-linear-attention"
specializations = 1
config = { num_warps = 1, num_stages = 3 }
